# FastGPT nginx 反向代理模板
#
# 【前置要求】本文件用到 $connection_upgrade 变量，它必须在 nginx.conf 的 http 块中
# 预先定义，否则 nginx 启动会报 "unknown variable connection_upgrade"：
#
#   http {
#       map $http_upgrade $connection_upgrade {
#           default upgrade;
#           ''      close;
#       }
#       include /etc/nginx/conf.d/*.conf;
#   }
#
# 使用前必改：
#   1. server_name          换成你的域名
#   2. ssl_certificate*     换成证书路径（不用 HTTPS 见文末说明）
#   3. upstream fastgpt     换成 app 的实际地址
#
# 配置完成后，compose 里的 FE_DOMAIN 必须改成用户浏览器实际访问的地址
# （含协议），例如 https://fastgpt.example.com，否则图片、文件下载链接会指向错误主机。

upstream fastgpt {
    # nginx 与 FastGPT 同机时用 127.0.0.1；
    # nginx 也在 docker 且与 app 同网络时，可直接写服务名 fastgpt-app:3000
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fastgpt.example.com;

    # 证书签发（如 certbot）需要放行此路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fastgpt.example.com;

    ssl_certificate     /etc/nginx/ssl/fastgpt.crt;
    ssl_certificate_key /etc/nginx/ssl/fastgpt.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 知识库上传单文件上限由 UPLOAD_FILE_MAX_SIZE 控制（默认 1000MB）。
    # 这里必须不小于该值，否则大文件会被 nginx 以 413 拦在门外。
    client_max_body_size 1024m;
    client_body_timeout  300s;

    # 静态资源压缩。图片和已压缩格式不要重复压缩。
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    access_log /var/log/nginx/fastgpt.access.log;
    error_log  /var/log/nginx/fastgpt.error.log warn;

    location / {
        proxy_pass http://fastgpt;
        proxy_http_version 1.1;

        # FastGPT 按 x-real-ip 优先、其次 x-forwarded-for 解析客户端 IP，
        # 用于登录会话记录与审计日志。缺失会导致记录成 nginx 的内网地址。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / 连接升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 对话是 SSE 流式返回，必须关闭缓冲，
        # 否则响应会被 nginx 攒在内存里一次性吐出，前端表现为「长时间无响应后突然全部出现」。
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;

        # 知识库训练、长对话可能持续数分钟，超时给足。
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Next.js 构建产物带内容哈希，可长期缓存
    location /_next/static/ {
        proxy_pass http://fastgpt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 可选：文件下载短链。
    # 仅在 compose 配置了 FILE_DOWNLOAD_PUBLIC_URL_PREFIX 时才需要，
    # 用于把 https://域名/d/{signedAlias} 重写到应用的下载接口。
    # 未配置该变量时请整段删除——否则会与上面的 location / 产生歧义。
    #
    # location ~ ^/d/(.+)$ {
    #     proxy_pass http://fastgpt/api/system/file/d/$1;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host            $host;
    #     proxy_set_header X-Real-IP       $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_buffering off;
    #     proxy_read_timeout 600s;
    # }
}
